name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security scan every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  trivy-container-scan:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Get version info
        id: version
        run: |
          VERSION=$(cat VERSION)
          GIT_COMMIT=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "git_commit=${GIT_COMMIT}" >> $GITHUB_OUTPUT
      
      - name: Build Docker image
        run: |
          docker build \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --build-arg GIT_COMMIT=${{ steps.version.outputs.git_commit }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -t dicomconverter:test \
            -f Dockerfile.secure \
            .
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dicomconverter:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail the build, just report
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dicomconverter:test'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail if CRITICAL or HIGH vulnerabilities found

  python-security-scan:
    name: Python Dependency Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install safety
        run: |
          pip install safety
      
      - name: Scan RT-STRUCT requirements
        run: |
          echo "Scanning src/rtstruct/requirements.txt"
          safety check --file src/rtstruct/requirements.txt --json > safety-rtstruct.json || true
          cat safety-rtstruct.json
      
      - name: Upload safety results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-reports
          path: safety-*.json
      
      - name: Check for critical vulnerabilities
        run: |
          # Parse JSON and fail if critical vulnerabilities found
          if [ -f safety-rtstruct.json ]; then
            CRITICAL_COUNT=$(jq '.vulnerabilities | length' safety-rtstruct.json || echo "0")
            echo "Found $CRITICAL_COUNT vulnerabilities"
            if [ "$CRITICAL_COUNT" -gt "0" ]; then
              echo "::error::Critical vulnerabilities found in Python dependencies"
              exit 1
            fi
          fi

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional

  dockerfile-lint:
    name: Dockerfile Best Practices Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.secure
          failure-threshold: warning
          format: sarif
          output-file: hadolint-results.sarif
      
      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-results.sarif

  sbom-generation:
    name: Generate Software Bill of Materials (SBOM)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build -t dicomconverter:sbom -f Dockerfile.secure .
      
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      
      - name: Generate SBOM
        run: |
          syft dicomconverter:sbom -o spdx-json > sbom.spdx.json
          syft dicomconverter:sbom -o cyclonedx-json > sbom.cyclonedx.json
      
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
      
      - name: Scan SBOM for vulnerabilities
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype sbom:sbom.spdx.json --fail-on high

  security-report:
    name: Generate Security Report
    needs: [trivy-container-scan, python-security-scan, secret-scan, dockerfile-lint, sbom-generation]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
      
      - name: Generate summary report
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Container Vulnerability Scan: ${{ needs.trivy-container-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Python Dependency Scan: ${{ needs.python-security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Detection: ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dockerfile Lint: ${{ needs.dockerfile-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM Generation: ${{ needs.sbom-generation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Review findings in GitHub Security tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Address CRITICAL and HIGH severity issues" >> $GITHUB_STEP_SUMMARY
          echo "3. Update dependencies and rebuild" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # Optional: Fail the workflow if any critical issues found
  security-gate:
    name: Security Gate Check
    needs: [trivy-container-scan, python-security-scan, secret-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Check security status
        run: |
          if [ "${{ needs.trivy-container-scan.result }}" != "success" ] || \
             [ "${{ needs.python-security-scan.result }}" != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "::error::Security gate failed - critical vulnerabilities or secrets detected"
            exit 1
          fi
          echo "✅ Security gate passed"
