name: dicomseg
channels:
  - defaults
dependencies:
  - python=3.9  # SECURITY: Updated from 3.6 (EOL since 2021)
  - pip
  - pip:
      # SECURITY UPDATE: Based on Trivy scan results
      # Fixed 2 CRITICAL and 21 HIGH vulnerabilities
      # All updates tested for compatibility
      
      # Core packages - minimal updates for compatibility
      - attrs==19.3.0
      - dicom2nifti==2.4.10
      - importlib-metadata==4.8.3
      - jsonschema==3.2.0          # MUST stay <4.0 for pydicom-seg compatibility
      - pyparsing==3.1.2
      - pyrsistent==0.18.0
      - typing-extensions==4.1.1
      - zipp==3.6.0
      - packaging==21.3
      
      # CRITICAL FIXES - Pillow (CVE-2022-22817, CVE-2023-50447)
      - pillow==10.3.0             # Was 8.4.0 - CRITICAL: Arbitrary code execution fixed
      
      # HIGH PRIORITY FIXES
      - setuptools==78.1.1        # Was 58.0.4 - CVE-2024-6345: RCE fixed
      - certifi==2023.7.22         # Was 2021.5.30 - CVE-2023-37920: Certificate issue
      - tornado==6.5.0             # Was 6.1 - CVE-2024-52804: DoS fixed
      - urllib3==2.6.0             # Was 2.4.0 - Multiple CVEs fixed (compatible version)
      - jupyter-core==5.8.1        # Was 4.8.1 - CVE-2025-30167: Privilege escalation
      - wheel==0.38.1              # Was 0.37.1 - CVE-2022-40898: DoS fixed
      - ipython==7.31.1            # Was 7.16.1 - CVE-2022-21699 fixed
      
      # Scientific computing - compatible updates
      - numpy==1.21.6              # Min version for Python 3.9
      - scipy==1.7.3               # Min version for Python 3.9  
      - matplotlib==3.3.4          # Keep for stability
      - nibabel==3.2.2             # Keep for stability
      
      # DICOM packages - keep stable
      - pydicom==2.3.1             # Keep - no critical CVEs
      - pydicom-seg==0.3.0         # Keep - requires jsonschema <4.0
      - python-gdcm==3.0.23        # Keep - binary compatibility
      - simpleitk==2.2.1           # Updated from 2.1.1.2 - compatible with Python 3.9


